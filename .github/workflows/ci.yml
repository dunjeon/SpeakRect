# Pure unit tests only — no Local-LLM models, no live ModeSmoke/SettingsSmoke.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SpeakRect.sln

      - name: Build
        run: dotnet build SpeakRect.sln -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/SpeakRect.Tests/SpeakRect.Tests.csproj
          -c Release
          --no-build
          --verbosity normal
